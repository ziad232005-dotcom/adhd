name: adhd
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  pinput: 5.0.1
  image_picker: ^1.2.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  file_picker: ^8.3.7
  pdf: ">=3.11.3 <3.13.0" # 3.13 needs xml 7, which flutter_local_notifications 19 cannot use
  printing: ^5.12.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# image 4.11 calls ZLibDecoder.decodeLazy, which exists only in archive 4.4+.
# The resolver was picking archive 4.0.9, so the build failed.
dependency_overrides:
  archive: ^4.4.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/mazid/
    - sounds/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Regular.ttf
